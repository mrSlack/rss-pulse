name: pulse-production

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    # Slow-query visibility: pg_stat_statements aggregates statement statistics,
    # log_min_duration_statement logs statements slower than DB_LOG_MIN_DURATION_MS
    # (-1 disables, 0 logs every statement) without their parameter values, and
    # track_io_timing adds I/O times. Changing these arguments recreates (restarts)
    # the db container on the next `up -d`.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=${DB_LOG_MIN_DURATION_MS:-500}
      - -c
      - log_parameter_max_length=0
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ./data/postgres-production:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-12}
      RSS_REFRESH_CONCURRENCY: ${RSS_REFRESH_CONCURRENCY:-4}
      ARTICLE_RETENTION_DAYS: ${ARTICLE_RETENTION_DAYS:-180}
      QUARANTINE_RETENTION_DAYS: ${QUARANTINE_RETENTION_DAYS:-90}
      UNSUBSCRIBED_SOURCE_RETENTION_DAYS: ${UNSUBSCRIBED_SOURCE_RETENTION_DAYS:-30}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ADDR: ${METRICS_ADDR:-}
    expose:
      - "8080"
      - "9090"  # Prometheus metrics when METRICS_ADDR=:9090; Docker network only, no host port
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 70s  # migrations run before the API listens; long upgrade steps run in the background

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
