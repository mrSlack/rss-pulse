server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for every response, including errors. Feed images may
    # come from any HTTP(S) host; everything else must come from this origin.
    # HSTS is deliberately absent: it belongs to the TLS-terminating proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    # Locations below add their own headers; merge them with these instead of
    # replacing them (nginx otherwise drops inherited add_header directives).
    add_header_inherit merge;

    # Compress text responses (HTML is always included). Also responses passed
    # through a proxy that adds a Via header, such as a TLS-terminating proxy.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite content-hashes every file name under /assets/, so a changed file gets a
    # new URL and these can be cached for good. A missing asset is a 404 (no
    # index.html fallback), and the header is only sent with successful responses.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html and the unhashed files from public/ (theme-init.js, favicon.svg)
    # are revalidated on every use so a deployment takes effect immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
