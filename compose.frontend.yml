name: rss-reader-frontend

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    healthcheck:
      test: ["CMD-SHELL", "test -s /workspace/frontend/dist/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rss-reader-net

  nginx:
    image: nginx:1.30.6-alpine3.24
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rss-reader-net

volumes:
  frontend_node_modules:

networks:
  rss-reader-net:
    name: rss-reader-net
    external: true
